name: GMS Virtual Engine Cloud Build

on:
  push:
    branches:
      - gms-virtual-engine
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          ls -la "$ANDROID_HOME/cmdline-tools"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Install Required NDK
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.13846066"

      - name: Grant Gradle Permission
        run: chmod +x gradlew

      - name: Build APKs and Libraries
        run: |
          ./gradlew \
            :app:assembleDebug \
            :app:assembleRelease \
            :Bcore:assembleDebug \
            :Bcore:assembleRelease \
            :black-reflection:assemble \
            :compiler:assemble \
            --stacktrace

      - name: Upload APK Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GMS-Virtual-Engine-APKs
          path: |
            app/build/outputs/apk/**/*.apk
            Bcore/build/outputs/aar/*.aar
          if-no-files-found: warn
          retention-days: 7
